openapi: 3.1.0
info:
  title: Fraudebot API
  version: 1.0.0
  description: Fraud intelligence search and entity management.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
paths:
  /auth/register:
    post:
      summary: Register a reporter account
      responses:
        '201': { description: Account and token created }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/login:
    post:
      summary: Issue a scoped access token
      responses:
        '200': { description: Token issued }
        '422': { description: Invalid credentials }
  /auth/logout:
    post:
      summary: Revoke the current access token
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Token revoked }
  /public/reports:
    get:
      summary: Search active fraud reports by supported clue
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: p, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
        - { name: c, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Search results }
  /public/scammers/{id}:
    get:
      summary: Get an active scammer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Scammer detail }
        '404': { description: Not found }
  /public/organizations/{id}:
    get:
      summary: Get an active organization
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Organization detail }
        '404': { description: Not found }
