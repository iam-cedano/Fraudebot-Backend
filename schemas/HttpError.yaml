type: object
description: Error payload returned by the HTTP exception handler.
required:
  - error
properties:
  error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: string
        description: Machine-readable error code.
        enum:
          - not_found
          - conflict
          - rate_limited
          - http_error
        example: rate_limited
      message:
        type: string
        description: Human-readable error message.
        example: Too Many Attempts.
