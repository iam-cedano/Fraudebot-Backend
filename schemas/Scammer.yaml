type: object
description: A reported scammer or organization.
properties:
  id:
    type: string
  name:
    type: string
  country:
    type: string
    description: The country of the scammer.
  reports:
    type: integer
    description: The number of reports for the scammer.
  avatar_path:
    type: string
    description: The URL to the avatar image for the scammer. If no avatar is available, this will be null.
  products:
    type: array
    description: The categories of products promoted by the scammer.
    items:
      type: string
      enum:
        - "Crypto"
        - "Scamming"
        - "Money Laundering"
        - "Billing"
        - "Banking"
        - "Insurance"
        - "Real Estate"
        - "Legal"
        - "Other"
  status:
    type: boolean
    description: Whether the scammer is active.
  created_at:
    type: string
    description: "The date and time the scammer was created. Format: YYYY-MM-DD. (e.g. 2026-01-01)"
  updated_at:
    type: string
    description: "The date and time the scammer was last updated. Format: YYYY-MM-DD. (e.g. 2026-01-01)"