type: object
description: A reported organization
properties:
  id:
    type: string
  name:
    type: string
  country:
    type: string
    description: The country of the organization.
  reports:
    type: integer
    description: The number of reports for the organization.
  avatar_path:
    type: string
    description: The URL to the avatar image for the organization. If no avatar is available, this will be null.
  products:
    type: array
    description: The categories of products promoted by the organization.
    items:
      type: string
      enum:
        - "Crypto"
        - "Scamming"
        - "Money Laundering"
        - "Billing"
        - "Banking"
        - "Insurance"
        - "Real Estate"
        - "Legal"
        - "Other"
      example:
        - "Crypto"
        - "Scamming"
        - "Money Laundering"
        - "Billing"
        - "Banking"
        - "Insurance"
        - "Real Estate"
        - "Legal"
        - "Other"
  status:
    type: boolean
    description: Whether the organization is active.
  created_at:
    type: string
    description: "The date the organization was created. Format: DD-MM-YYYY. (e.g. 24-08-2026)"
    example: "24-08-2026"
  updated_at:
    type: string
    description: "The date the organization was last updated. Format: DD-MM-YYYY. (e.g. 24-08-2026)"
    example: "24-08-2026"