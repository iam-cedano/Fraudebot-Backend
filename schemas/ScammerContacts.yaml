type: object
description: The contacts of a scammer
properties:
  data:
    type: array
    description: The contacts objects
    items:
      type: object
      properties:
        id:
          type: string
          description: The ID of the contact
        name:
          type: string
          description: The name of the contact
        reference:
          type: string
          description: The phone number/email/url/profile/username/reference of the contact which is used by the scammer
        platform:
          type: string
          description: The platform of the contact. Full name of the platform
          example:
            - "WhatsApp"
            - "Facebook"
            - "YouTube"
            - "TikTok"
            - "Email"
            - "Cellphone"
            - "Telegram"
            - "Instagram"
            - "URL"
            - "Other"
        status:
          type: boolean
          description: Whether the contact is active.
        created_at:
          type: string
          description: "The date the contact was created. Format: DD-MM-YYYY. (e.g. 24-08-2026)"
          example: "24-08-2026"
  total:
    type: integer
    description: The total number of contacts
  page:
    type: integer
    description: The page number
  count:
    type: integer
    description: The number of contacts per page